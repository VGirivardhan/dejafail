[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dejafail"
version = "0.1.0"
description = "CI triage agent that remembers every red build, built on Hindsight agent memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hindsight-client==0.10.1",
  "openai>=1.40,<4",
  "python-dotenv>=1.0",
  "streamlit>=1.37",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dejafail = "dejafail.cli:main"

[tool.setuptools]
packages = ["dejafail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
